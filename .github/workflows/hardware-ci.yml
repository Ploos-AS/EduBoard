name: Hardware CI

on:
  push:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-ci.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - '.github/workflows/hardware-ci.yml'
  workflow_dispatch:

jobs:
  avr-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate EduBoard-AVR source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f hardware/avr/kicad/edu-board-avr.kicad_pro
          test -f hardware/avr/kicad/01-core-spec.md
          test -f hardware/avr/kicad/01-core.kicad_sch
          test -f hardware/avr/kicad/tools/capture_core.py
          test -f hardware/avr/PIN_ALLOCATION.md
          test -f hardware/avr/PIN_QUALIFICATION.md
          test -f hardware/avr/ELECTRICAL_ARCHITECTURE.md
          test -f hardware/avr/COMPONENT_BASELINE.md
          python3 -m json.tool hardware/avr/kicad/edu-board-avr.kicad_pro >/dev/null

      - name: Install current KiCad CLI and libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad kicad-libraries

      - name: Report KiCad installation
        shell: bash
        run: |
          set -euo pipefail
          kicad-cli version
          dpkg -L kicad-symbols | head -40 || true
          find /usr/share/kicad -maxdepth 3 -type f -name '*.kicad_sym' -print -quit || true

      - name: Resolve target MCU in installed KiCad libraries
        run: python3 hardware/avr/kicad/tools/capture_core.py

      - name: Prove minimal KiCad bootstrap loads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hardware/avr/bootstrap
          cp hardware/avr/kicad/tools/generate_core_bootstrap.py build/hardware/avr/bootstrap/
          python3 - <<'PY'
          from pathlib import Path
          p=Path("hardware/avr/kicad/tools/generate_core_bootstrap.py")
          s=p.read_text()
          s=s.replace('out = Path("hardware/avr/kicad/01-core.kicad_sch")', 'out = Path("build/hardware/avr/bootstrap/minimal.kicad_sch")')
          s=s.replace('meta = Path("hardware/avr/kicad/01-core.contract.txt")', 'meta = Path("build/hardware/avr/bootstrap/minimal.contract.txt")')
          ns={"__name__":"__main__"}
          exec(compile(s, str(p), "exec"), ns)
          PY
          kicad-cli sch export pdf --output build/hardware/avr/bootstrap/minimal.pdf build/hardware/avr/bootstrap/minimal.kicad_sch

      - name: Validate M2.1a capture tool against installed libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/avr/kicad/tools/capture_core.py

      - name: Validate canonical capture against M2.1a contract
        shell: bash
        run: |
          set -euo pipefail
          python3 hardware/avr/kicad/tools/capture_core.py hardware/avr/kicad/01-core.kicad_sch

      - name: Verify M2.1a canonical schematic is real capture
        shell: bash
        run: |
          set -euo pipefail
          SCH=hardware/avr/kicad/01-core.kicad_sch
          grep -F 'ATmega1284P-PU' "$SCH"
          grep -F '(symbol' "$SCH"
          grep -F '(wire' "$SCH"
          grep -F '(junction' "$SCH"
          grep -F '(label' "$SCH"
          grep -F '"Value" "ATmega1284P-PU"' "$SCH"
          grep -F '"Value" "10k"' "$SCH"
          grep -F '"Value" "100nF"' "$SCH"
          grep -F '"Value" "8MHz"' "$SCH"
          grep -F '"Reference" "FB1"' "$SCH"
          grep -F '"Reference" "TP_5V"' "$SCH"
          grep -F '"Reference" "TP_GND"' "$SCH"
          grep -F '"Reference" "TP_RESET"' "$SCH"
          grep -F '"Reference" "TP_AVCC"' "$SCH"
          grep -F '"Reference" "TP_AREF"' "$SCH"

      - name: Validate clean M2.1a component semantics
        shell: bash
        run: |
          set -euo pipefail
          SCH=hardware/avr/kicad/01-core.kicad_sch
          python3 - <<'PY'
          from pathlib import Path
          s = Path("hardware/avr/kicad/01-core.kicad_sch").read_text()
          required = {
              "U1": "ATmega1284P-PU",
              "R_RESET": "10k",
              "Y1": "8MHz",
              "C_AVCC1": "100nF",
              "C_AVCC2": "1uF",
              "C_AREF": "100nF",
              "C_VCC1": "100nF",
              "C_VCC2": "100nF",
              "C_BULK": "10uF",
              "C_XTAL1": "TBD_FROM_Y1_CL",
              "C_XTAL2": "TBD_FROM_Y1_CL",
          }
          for ref, value in required.items():
              rp = f'(property "Reference" "{ref}"'
              vp = f'(property "Value" "{value}"'
              if rp not in s or vp not in s:
                  raise SystemExit(f"missing M2.1a semantic component: {ref}={value}")
          typed = {
              "U1": 'lib_id "MCU_Microchip_ATmega:ATmega1284P-P"',
              "R_RESET": 'lib_id "Device:R"',
              "FB1": 'lib_id "Device:L"',
              "Y1": 'lib_id "Device:Crystal"',
              "SW_RESET": 'lib_id "Switch:SW_Push"',
              "C_XTAL1": 'lib_id "Device:C"',
              "C_XTAL2": 'lib_id "Device:C"',
          }
          for ref, lib_id in typed.items():
              pos = s.find(f'(property "Reference" "{ref}"')
              if pos < 0:
                  raise SystemExit(f"missing typed M2.1a component: {ref}")
              start = s.rfind("(symbol (lib_id ", 0, pos)
              header = s[start:pos] if start >= 0 else ""
              if lib_id not in header:
                  raise SystemExit(f"{ref} has wrong symbol type; expected {lib_id}")
          if 'Package_DIP:DIP-40_W15.24mm' not in s:
              raise SystemExit("U1 DIP-40 footprint contract missing")
          for ref in ("TP_5V","TP_GND","TP_RESET","TP_AVCC","TP_AREF"):
              if f'(property "Reference" "{ref}"' not in s:
                  raise SystemExit(f"missing required test point {ref}")
          print("PASS: clean M2.1a semantic component contract")
          required_labels = [*(f"PA{i}" for i in range(8)), *(f"PB{i}" for i in range(8)),
                             *(f"PC{i}" for i in range(8)), *(f"PD{i}" for i in range(8)),
                             "RESET", "AREF", "+5V", "GND"]
          for label in required_labels:
              if f'(label "{label}"' not in s and f'(global_label "{label}"' not in s and f'(hierarchical_label "{label}"' not in s:
                  raise SystemExit(f"missing M2.1a sheet-boundary label: {label}")
          print("PASS: M2.1a sheet-boundary labels")
          PY

      - name: Bisect canonical KiCad root forms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path("hardware/avr/kicad/01-core.kicad_sch").read_text()
          lines=src.splitlines(True)
          forms=[]
          depth=0
          start=None
          for i,line in enumerate(lines):
              before=depth
              depth += line.count("(")-line.count(")")
              if before == 1 and line.lstrip().startswith("("):
                  start=i
              if start is not None and depth == 1:
                  forms.append((start,i+1))
                  start=None
          keep_prefix=[]
          for a,b in forms:
              head=lines[a].lstrip()
              if head.startswith("(uuid ") or head.startswith("(paper ") or head.startswith("(lib_symbols"):
                  keep_prefix.append((a,b))
          body=[x for x in forms if x not in keep_prefix and not lines[x[0]].lstrip().startswith("(sheet_instances")]
          base="(kicad_sch (version 20230121) (generator eeschema)\n"
          for a,b in keep_prefix:
              base += "".join(lines[a:b])
          out=Path("build/hardware/avr/bisect")
          out.mkdir(parents=True,exist_ok=True)
          for n in range(len(body)+1):
              text=base
              for a,b in body[:n]:
                  text += "".join(lines[a:b])
              text += '  (sheet_instances\n    (path "/" (page "1"))\n  )\n)\n'
              (out/f"{n:03d}.kicad_sch").write_text(text)
          (out/"map.txt").write_text("\n".join(f"{n+1:03d} line {a+1}: {lines[a].strip()[:120]}" for n,(a,b) in enumerate(body))+"\n")
          print(f"Generated {len(body)+1} cumulative parser probes")
          PY
          last_ok=-1
          for f in build/hardware/avr/bisect/*.kicad_sch; do
            n=$(basename "$f" .kicad_sch)
            if kicad-cli sch export pdf --output build/hardware/avr/bisect/"$n".pdf "$f" >/dev/null 2>&1; then
              last_ok=$((10#$n))
            else
              echo "First cumulative load failure: $n"
              sed -n "$((10#$n))p" build/hardware/avr/bisect/map.txt || true
              echo "Last successful cumulative probe: $last_ok"
              exit 1
            fi
          done
          echo "All cumulative root-form probes loaded"

      - name: Diagnose canonical M2.1a load
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/hardware/avr
          SCH=hardware/avr/kicad/01-core.kicad_sch
          kicad-cli sch export pdf --output build/hardware/avr/01-core-load-test.pdf "$SCH" >build/hardware/avr/01-core-load-test.log 2>&1
          rc=$?
          cat build/hardware/avr/01-core-load-test.log
          echo "kicad_load_exit_code=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "First 40 root-level forms (line:number/form):"
            python3 - <<'PY'
          from pathlib import Path
          s=Path("hardware/avr/kicad/01-core.kicad_sch").read_text().splitlines()
          depth=0
          shown=0
          for n,line in enumerate(s,1):
              before=depth
              depth += line.count("(")-line.count(")")
              if before == 1 and line.lstrip().startswith("("):
                  print(f"{n}:{line.strip()[:120]}")
                  shown += 1
                  if shown >= 40:
                      break
          PY
            exit "$rc"
          fi

      - name: ERC canonical M2.1a core schematic
        id: core_erc
        run: |
          mkdir -p build/hardware/avr
          kicad-cli sch erc --exit-code-violations --output build/hardware/avr/01-core-erc.rpt hardware/avr/kicad/01-core.kicad_sch

      - name: Validate canonical core KiCad syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hardware/avr
          kicad-cli sch export pdf --output build/hardware/avr/01-core.pdf hardware/avr/kicad/01-core.kicad_sch

      - name: ERC top-level schematic when present
        shell: bash
        run: |
          set -euo pipefail
          SCH=hardware/avr/kicad/edu-board-avr.kicad_sch
          if [ -f "$SCH" ]; then
            kicad-cli sch erc --exit-code-violations --output build/hardware/avr/erc.rpt "$SCH"
            kicad-cli sch export pdf --output build/hardware/avr/edu-board-avr-schematic.pdf "$SCH"
          else
            echo "Top-level integrated schematic pending."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduboard-avr-hardware-ci
          path: build/hardware/avr/
          if-no-files-found: warn

      - name: Show canonical core ERC report
        if: always()
        run: |
          test ! -f build/hardware/avr/01-core-erc.rpt || cat build/hardware/avr/01-core-erc.rpt

